<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Стіч вчить літери 🌴</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{font-family:'Comic Sans MS','Trebuchet MS',sans-serif;overflow:hidden;height:100vh;background:#87CEEB}

#game{
  position:relative;width:100vw;height:100vh;
  background-size:cover;background-position:center;
  background-image:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600');
  overflow:hidden;
}

/* ===== ГЕРОЙ ===== */
#hero{
  position:absolute;bottom:14%;left:3%;
  width:320px;height:auto;z-index:5;
  filter:drop-shadow(4px 6px 10px rgba(0,0,0,0.5));
  transition:transform .3s;
}
#hero.happy{transform:scale(1.12) rotate(-6deg)}
#hero.sad{transform:scale(.92) rotate(6deg)}

/* ===== КОКОС ===== */
#coconut{
  position:absolute;top:46%;left:50%;
  transform:translate(-50%,-50%);
  width:300px;height:300px;cursor:pointer;z-index:10;
  transition:transform .2s;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,0.5));
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translate(-50%,-50%) translateY(0)}
  50%{transform:translate(-50%,-50%) translateY(-18px)}
}
#coconut:hover{animation:none;transform:translate(-50%,-50%) scale(1.1)}
#coconut:active{transform:translate(-50%,-50%) scale(.93)}
#coconut.hidden{display:none}
#coconut img{width:100%;height:100%;object-fit:contain}

/* ===== КАРТИНКА ===== */
#picture{
  position:absolute;top:28%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  width:340px;height:340px;z-index:15;
  border-radius:24px;border:10px solid #fff;
  box-shadow:0 12px 40px rgba(0,0,0,0.5);
  background:#fff;display:flex;align-items:center;justify-content:center;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1);
}
#picture.show{transform:translate(-50%,-50%) scale(1)}
#picture img{max-width:95%;max-height:95%;border-radius:14px;object-fit:contain}

/* ===== КОШИКИ ===== */
#baskets{
  position:absolute;bottom:1%;left:50%;
  transform:translateX(-50%);
  display:flex;gap:50px;z-index:8;
}
.basket{
  width:230px;height:250px;position:relative;cursor:pointer;
  transition:transform .2s;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,0.45));
}
.basket:hover{transform:translateY(-14px) scale(1.07)}
.basket img{width:100%;height:100%;object-fit:contain}
.basket .letter{
  position:absolute;top:28%;left:50%;
  transform:translate(-50%,-50%);
  font-size:90px;font-weight:900;color:#fff;
  text-shadow:4px 4px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,0 0 20px rgba(0,0,0,.3);
  pointer-events:none;
}

/* ===== SCORE ===== */
#score{
  position:absolute;top:20px;right:20px;
  background:rgba(255,255,255,.92);padding:14px 24px;
  border-radius:30px;font-size:26px;font-weight:bold;
  color:#ff6b9d;box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:20;
}

/* ===== FEEDBACK ===== */
#feedback{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:140px;z-index:50;opacity:0;pointer-events:none;
}
#feedback.show{opacity:1;animation:pop .9s forwards}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(0);opacity:1}
  50%{transform:translate(-50%,-50%) scale(1.4);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}

/* ===== SETTINGS BTN ===== */
#settingsBtn{
  position:absolute;top:20px;left:20px;
  width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.92);border:none;
  font-size:28px;cursor:pointer;z-index:30;
  box-shadow:0 4px 14px rgba(0,0,0,0.2);
}

/* ===== SETTINGS PANEL ===== */
#settings{
  position:absolute;top:0;left:-480px;
  width:460px;height:100vh;
  background:rgba(255,242,225,.98);
  padding:24px 20px;overflow-y:auto;
  transition:left .4s;z-index:40;
  box-shadow:6px 0 24px rgba(0,0,0,0.3);
}
#settings.open{left:0}
#settings h2{color:#ff6b9d;margin-bottom:12px;font-size:22px}
#settings h3{color:#4a90e2;margin:18px 0 8px;font-size:17px;border-bottom:2px dashed #4a90e2;padding-bottom:4px}
.sr{
  display:flex;flex-direction:column;gap:6px;margin-bottom:10px;
  background:rgba(255,255,255,.65);padding:12px;border-radius:12px;
}
.sr label{font-weight:bold;font-size:13px;color:#333}
.sr input[type="text"],.sr input[type="url"]{
  padding:7px;border:2px solid #4a90e2;border-radius:7px;font-size:13px;width:100%;
}
.sr input[type="file"]{font-size:11px}
.sr .preview{
  width:70px;height:70px;object-fit:contain;
  border:2px dashed #bbb;border-radius:8px;background:#fff;
}
.hint{font-size:11px;color:#777;font-style:italic}

/* Картинки категорії */
.cat-pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cat-pic-item{
  position:relative;width:72px;height:72px;
  border:2px solid #4a90e2;border-radius:8px;overflow:hidden;background:#fff;
}
.cat-pic-item img{width:100%;height:100%;object-fit:contain}
.cat-pic-item .del-pic{
  position:absolute;top:2px;right:2px;
  width:20px;height:20px;border-radius:50%;
  background:#f44;color:#fff;border:none;
  font-size:12px;cursor:pointer;line-height:18px;text-align:center;
}
.add-pic-btn{
  width:72px;height:72px;border:3px dashed #4CAF50;border-radius:8px;
  background:rgba(76,175,80,.1);color:#4CAF50;
  font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.add-pic-btn:hover{background:rgba(76,175,80,.25)}

.add-pic-form{
  display:none;margin-top:6px;padding:8px;
  background:#e8f5e9;border-radius:8px;
}
.add-pic-form.open{display:flex;flex-direction:column;gap:4px}

.btn-row{display:flex;gap:8px;margin-top:16px}
.btn{
  flex:1;padding:12px;border:none;border-radius:10px;
  font-weight:bold;cursor:pointer;font-size:15px;
}
.btn-save{background:#4CAF50;color:#fff}
.btn-reset{background:#f44336;color:#fff}
.btn-close{background:#888;color:#fff}
.btn:hover{opacity:.88}

#closeSettings{
  position:absolute;top:12px;right:12px;
  background:#ff6b9d;color:#fff;border:none;
  width:34px;height:34px;border-radius:50%;
  cursor:pointer;font-weight:bold;font-size:18px;
}

/* Адаптив для мобільних */
@media(max-width:900px){
  #hero{width:180px;bottom:20%}
  #coconut{width:200px;height:200px}
  #picture{width:240px;height:240px}
  .basket{width:140px;height:160px}
  .basket .letter{font-size:56px}
  #baskets{gap:20px}
  #settings{width:100vw;left:-100vw}
}
</style>
</head>
<body>

<div id="game">
  <img id="hero" src="" alt="Герой">
  <div id="score">⭐ <span id="scoreVal">0</span></div>
  <button id="settingsBtn" title="Налаштування">⚙️</button>
  <div id="coconut"><img id="coconutImg" src=""></div>
  <div id="picture"><img id="pictureImg" src=""></div>
  <div id="baskets"></div>
  <div id="feedback"></div>
</div>

<div id="settings">
  <button id="closeSettings">✕</button>
  <h2>🎨 Налаштування гри</h2>
  <p class="hint">Вставте URL або завантажте файл з комп'ютера. Зміни зберігаються в браузері.</p>

  <h3>🌅 Фон</h3>
  <div class="sr">
    <label>URL:</label><input type="url" id="s_bg_url">
    <label>Файл:</label><input type="file" id="s_bg_file" accept="image/*">
    <img class="preview" id="p_bg">
  </div>

  <h3>👾 Герой</h3>
  <div class="sr">
    <label>URL:</label><input type="url" id="s_hero_url">
    <label>Файл:</label><input type="file" id="s_hero_file" accept="image/*">
    <img class="preview" id="p_hero">
  </div>

  <h3>🥥 Кнопка (кокос)</h3>
  <div class="sr">
    <label>URL:</label><input type="url" id="s_coconut_url">
    <label>Файл:</label><input type="file" id="s_coconut_file" accept="image/*">
    <img class="preview" id="p_coconut">
  </div>

  <div id="catSettings"></div>

  <div class="btn-row">
    <button class="btn btn-save" id="saveBtn">💾 Зберегти</button>
    <button class="btn btn-reset" id="resetBtn">🔄 Скинути</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-close" id="closeBtn2">Закрити</button>
  </div>
</div>

<script>
// ===================== DEFAULTS =====================
const DEFAULTS = {
  bg: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600',
  hero: 'https://upload.wikimedia.org/wikipedia/en/thumb/c/c8/Stitch_%28Lilo_%26_Stitch%29.svg/220px-Stitch_%28Lilo_%26_Stitch%29.svg.png',
  coconut: 'https://cdn-icons-png.flaticon.com/512/3503/3503808.png',
  categories: [
    {
      letter: 'А',
      basketImg: 'https://cdn-icons-png.flaticon.com/512/3587/3587021.png',
      pictures: [
        'https://cdn-icons-png.flaticon.com/512/3503/3503795.png',
        'https://cdn-icons-png.flaticon.com/512/2909/2909755.png'
      ]
    },
    {
      letter: 'О',
      basketImg: 'https://cdn-icons-png.flaticon.com/512/3587/3587021.png',
      pictures: [
        'https://cdn-icons-png.flaticon.com/512/3082/3082113.png',
        'https://cdn-icons-png.flaticon.com/512/415/415733.png'
      ]
    },
    {
      letter: 'У',
      basketImg: 'https://cdn-icons-png.flaticon.com/512/3587/3587021.png',
      pictures: [
        'https://cdn-icons-png.flaticon.com/512/3503/3503817.png',
        'https://cdn-icons-png.flaticon.com/512/2737/2737719.png'
      ]
    }
  ]
};

// ===================== CONFIG =====================
let config = JSON.parse(JSON.stringify(DEFAULTS));
const saved = localStorage.getItem('stichGameV2');
if (saved) { try { config = JSON.parse(saved); } catch(e){} }

// URL params override
const up = new URLSearchParams(location.search);
if (up.has('bg')) config.bg = up.get('bg');
if (up.has('hero')) config.hero = up.get('hero');
if (up.has('coconut')) config.coconut = up.get('coconut');

// ===================== APPLY =====================
function apply() {
  document.getElementById('game').style.backgroundImage = `url('${config.bg}')`;
  document.getElementById('hero').src = config.hero;
  document.getElementById('coconutImg').src = config.coconut;

  const bc = document.getElementById('baskets');
  bc.innerHTML = '';
  config.categories.forEach((cat, i) => {
    const d = document.createElement('div');
    d.className = 'basket';
    d.dataset.idx = i;
    d.innerHTML = `<img src="${cat.basketImg}"><span class="letter">${cat.letter}</span>`;
    d.addEventListener('click', () => onBasket(i));
    bc.appendChild(d);
  });
}
apply();

// ===================== GAME LOGIC =====================
let currentCat = null;
let score = 0;
const coconutEl = document.getElementById('coconut');
const pictureEl = document.getElementById('picture');
const pictureImg = document.getElementById('pictureImg');
const feedbackEl = document.getElementById('feedback');
const scoreVal = document.getElementById('scoreVal');
const heroEl = document.getElementById('hero');

function showFB(emoji) {
  feedbackEl.textContent = emoji;
  feedbackEl.classList.remove('show');
  void feedbackEl.offsetWidth;
  feedbackEl.classList.add('show');
}

coconutEl.addEventListener('click', () => {
  if (currentCat !== null) return;
  const idx = Math.floor(Math.random() * config.categories.length);
  currentCat = idx;
  const pics = config.categories[idx].pictures;
  if (pics.length === 0) { currentCat = null; return; }
  pictureImg.src = pics[Math.floor(Math.random() * pics.length)];
  coconutEl.classList.add('hidden');
  pictureEl.classList.add('show');
});

function onBasket(idx) {
  if (currentCat === null) return;
  if (idx === currentCat) {
    score++;
    scoreVal.textContent = score;
    showFB('✅');
    heroEl.classList.add('happy');
    setTimeout(() => heroEl.classList.remove('happy'), 700);
  } else {
    score = Math.max(0, score - 1);
    scoreVal.textContent = score;
    showFB('❌');
    heroEl.classList.add('sad');
    setTimeout(() => heroEl.classList.remove('sad'), 700);
  }
  currentCat = null;
  setTimeout(() => {
    pictureEl.classList.remove('show');
    coconutEl.classList.remove('hidden');
  }, 900);
}

// ===================== SETTINGS PANEL =====================
const settings = document.getElementById('settings');
document.getElementById('settingsBtn').onclick = () => { buildSettings(); settings.classList.add('open'); };
document.getElementById('closeSettings').onclick = () => settings.classList.remove('open');
document.getElementById('closeBtn2').onclick = () => settings.classList.remove('open');

// Helper: bind file input
function bindFile(fileId, previewId, cb) {
  document.getElementById(fileId).addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => { cb(ev.target.result); document.getElementById(previewId).src = ev.target.result; };
    r.readAsDataURL(f);
  });
}
function bindUrl(urlId, previewId, cb) {
  document.getElementById(urlId).addEventListener('change', e => {
    if (e.target.value) { cb(e.target.value); document.getElementById(previewId).src = e.target.value; }
  });
}

function buildSettings() {
  // Basic
  const isData = v => v && v.startsWith('data:');
  document.getElementById('s_bg_url').value = isData(config.bg) ? '' : config.bg;
  document.getElementById('p_bg').src = config.bg;
  document.getElementById('s_hero_url').value = isData(config.hero) ? '' : config.hero;
  document.getElementById('p_hero').src = config.hero;
  document.getElementById('s_coconut_url').value = isData(config.coconut) ? '' : config.coconut;
  document.getElementById('p_coconut').src = config.coconut;

  bindUrl('s_bg_url','p_bg', v => config.bg = v);
  bindFile('s_bg_file','p_bg', v => config.bg = v);
  bindUrl('s_hero_url','p_hero', v => config.hero = v);
  bindFile('s_hero_file','p_hero', v => config.hero = v);
  bindUrl('s_coconut_url','p_coconut', v => config.coconut = v);
  bindFile('s_coconut_file','p_coconut', v => config.coconut = v);

  // Categories
  const wrap = document.getElementById('catSettings');
  wrap.innerHTML = '';

  config.categories.forEach((cat, ci) => {
    const h = document.createElement('h3');
    h.textContent = `🧺 Категорія «${cat.letter}»`;
    wrap.appendChild(h);

    const sr = document.createElement('div');
    sr.className = 'sr';

    // Letter
    sr.innerHTML = `<label>Літера:</label><input type="text" maxlength="3" value="${cat.letter}" id="s_cat_letter_${ci}">`;

    // Basket img
    sr.innerHTML += `
      <label>Кошик URL:</label><input type="url" id="s_cat_burl_${ci}" value="${isData(cat.basketImg)?'':cat.basketImg}">
      <label>Кошик файл:</label><input type="file" id="s_cat_bfile_${ci}" accept="image/*">
      <img class="preview" id="p_cat_b_${ci}" src="${cat.basketImg}">
    `;

    // Pictures label
    sr.innerHTML += `<label>Картинки (${cat.pictures.length} шт.):</label>`;

    // Pictures container
    const picsDiv = document.createElement('div');
    picsDiv.className = 'cat-pics';
    picsDiv.id = `cat_pics_${ci}`;
    sr.appendChild(picsDiv);

    // Add button
    const addBtn = document.createElement('button');
    addBtn.className = 'add-pic-btn';
    addBtn.textContent = '+';
    addBtn.title = 'Додати картинку';
    picsDiv.appendChild(addBtn);

    // Add form (hidden)
    const addForm = document.createElement('div');
    addForm.className = 'add-pic-form';
    addForm.id = `add_form_${ci}`;
    addForm.innerHTML = `
      <label style="font-size:12px">URL нової картинки:</label>
      <input type="url" id="s_newpic_url_${ci}" placeholder="https://...">
      <label style="font-size:12px">Або файл:</label>
      <input type="file" id="s_newpic_file_${ci}" accept="image/*">
      <button class="btn btn-save" style="padding:6px;font-size:13px" id="s_newpic_ok_${ci}">✅ Додати</button>
    `;
    sr.appendChild(addForm);

    wrap.appendChild(sr);

    // Render existing pictures
    renderPics(ci);

    // Events
    addBtn.onclick = () => addForm.classList.toggle('open');

    document.getElementById(`s_cat_letter_${ci}`).addEventListener('input', e => {
      config.categories[ci].letter = e.target.value.toUpperCase() || '?';
    });
    bindUrl(`s_cat_burl_${ci}`, `p_cat_b_${ci}`, v => config.categories[ci].basketImg = v);
    bindFile(`s_cat_bfile_${ci}`, `p_cat_b_${ci}`, v => config.categories[ci].basketImg = v);

    document.getElementById(`s_newpic_ok_${ci}`).onclick = () => {
      const urlVal = document.getElementById(`s_newpic_url_${ci}`).value;
      const fileInput = document.getElementById(`s_newpic_file_${ci}`);
      if (fileInput.files[0]) {
        const r = new FileReader();
        r.onload = ev => {
          config.categories[ci].pictures.push(ev.target.result);
          renderPics(ci);
          addForm.classList.remove('open');
        };
        r.readAsDataURL(fileInput.files[0]);
      } else if (urlVal) {
        config.categories[ci].pictures.push(urlVal);
        renderPics(ci);
        addForm.classList.remove('open');
      }
    };
  });
}

function renderPics(ci) {
  const container = document.getElementById(`cat_pics_${ci}`);
  if (!container) return;
  // Remove old items (keep addBtn)
  container.querySelectorAll('.cat-pic-item').forEach(el => el.remove());
  const addBtn = container.querySelector('.add-pic-btn');

  config.categories[ci].pictures.forEach((src, pi) => {
    const item = document.createElement('div');
    item.className = 'cat-pic-item';
    item.innerHTML = `<img src="${src}"><button class="del-pic" title="Видалити">✕</button>`;
    item.querySelector('.del-pic').onclick = () => {
      config.categories[ci].pictures.splice(pi, 1);
      renderPics(ci);
    };
    container.insertBefore(item, addBtn);
  });

  // Update count label
  const sr = container.closest('.sr');
  if (sr) {
    const lbl = sr.querySelector('label:last-of-type');
    // find the label before cat-pics
    const labels = sr.querySelectorAll('label');
    labels.forEach(l => {
      if (l.textContent.startsWith('Картинки')) {
        l.textContent = `Картинки (${config.categories[ci].pictures.length} шт.):`;
      }
    });
  }
}

// ===================== SAVE / RESET =====================
document.getElementById('saveBtn').onclick = () => {
  localStorage.setItem('stichGameV2', JSON.stringify(config));
  apply();
  alert('✅ Збережено!');
  settings.classList.remove('open');
};

document.getElementById('resetBtn').onclick = () => {
  if (confirm('Скинути всі налаштування?')) {
    localStorage.removeItem('stichGameV2');
    config = JSON.parse(JSON.stringify(DEFAULTS));
    apply();
    buildSettings();
  }
};
</script>
</body>
</html>
